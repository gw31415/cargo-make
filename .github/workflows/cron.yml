name: CI
on:
    schedule:
        - cron: '0 17 * * 4'
env:
  CLICOLOR_FORCE: 1
jobs:
  cron_ci:
    name: cron_ci
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup override set stable
    - name: Install cargo-make
      run: cargo install --debug cargo-make
    - name: Run CI
      run: cargo run --bin cargo-make --target-dir target/ci -- make ci-flow
